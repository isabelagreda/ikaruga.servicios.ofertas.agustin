<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>IKARUGA · En actualización</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f5f2; color: #191919; font-family: Arial, sans-serif; }
    main { width: min(100%, 620px); padding: 52px 42px; text-align: center; background: #fff; border: 1px solid #ded9d2; box-shadow: 10px 10px 0 #8a123a; }
    img { width: min(190px, 65vw); height: auto; margin-bottom: 38px; }
    p { margin: 0; }
    .eyebrow { color: #8a123a; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0 16px; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1; }
    .message { max-width: 420px; margin: auto; color: #555; font-size: 1.05rem; line-height: 1.6; }
    @media (max-width: 480px) { main { padding: 42px 26px; box-shadow: 6px 6px 0 #8a123a; } }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="IKARUGA">
    <p class="eyebrow">Sitio temporalmente no disponible</p>
    <h1>Estamos en actualización</h1>
    <p class="message">Estamos preparando una nueva versión. Volvé a visitarnos pronto.</p>
  </main>
</body>
</html>
